<html></html>
    <head>
    <meta charset="UTF-8">
        <title>{{page.title}}</title>


        <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
      </script>

    </head>
<!---->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital@0;1&display=swap');

        :root{
          font-family: 'Lora', serif;
          --text-color: #d4af37;
          --bg-color: #0a1128;
          --accent-color: #1a2a4a;
        }

        body{
          background-color: var(--bg-color);
          color: var(--text-color);
        }

        p, li {
          margin: 1.2em 0;
          line-height: 1.8;
        }

        h3{
          color: var(--text-color);
        }
        
        .wrapper{
          display: grid;
          border-color: #fda553;
          height:98vh;
          top: 1vh;
          bottom: 1vh;
          grid-template-rows: 50px 10fr 30px;
          grid-template-columns: 170px 1fr;
          grid-gap: 5px 5px;
        }

        .logo{
          color: var(--text-color);
          background-color: rgba(212, 175, 55, 0.05);
          grid-column: 1;
          text-shadow: 1px 1px 5px rgba(212, 175, 55, 0.3);
          font-size: 36px;
          text-align:center;
          padding-top: 0px;
          padding-left: 10px;
          padding-bottom: 10px;
          padding-right: 10px;
          overflow-x: hidden;
          overflow-y:hidden ;
        }

        .topnav {
          
          overflow: hidden;
        
          grid-area: 1/2/2/2;
          }
        
        /* Style the links inside the navigation bar */
        .topnav a {
          float: left;
          color: var(--text-color);
          text-align: center;
          padding-top: 10px;
          padding-bottom: 12px;
          padding-left: 10px;
          padding-right: 10px;
          font-size: 17px;
          text-decoration: none;
        }

        /* Change the color of links on hover */
        .topnav a:hover {
          background: rgba(212, 175, 55, 0.15);
          color: #ffffff;
          text-shadow: 1px 1px 5px rgba(212, 175, 55, 0.5);
        }

        /* Add a color to the active/current link */
        .topnav a.active {
          color: #ffffff;
          background: rgba(212, 175, 55, 0.25);
          text-shadow: 1px 1px 8px rgba(212, 175, 55, 0.6);
        }
        
        #neon{
          font-size: 1em;
          font-weight: 600;
          color: var(--text-color);
          padding: 2% 3% 1%;
          text-transform: uppercase;
        }

        a {
          text-decoration: none;
          color: var(--text-color);
        }

        a:hover {
          color: #ffffff;
          text-shadow: 1px 1px 5px rgba(212, 175, 55, 0.5);
        }

        .sidenav {
          height: 100%;
          z-index: 2;
          background-color: rgba(26, 42, 74, 0.3);
          border: 1px solid rgba(212, 175, 55, 0.3);
          overflow-x: hidden;
          padding-top: 2px;
          padding-right: 8px;
          padding-bottom: 0px;
          padding-left: 8px;
          grid-column: 1;
      }

      /* The navigation menu links */
      .sidenav a {
          padding-top: 5px;
          padding-right: 3px;
          padding-bottom: 5px;
          padding-left: 8px;
          text-decoration: none;
          font-size: 18px;
          color: var(--text-color);
          display: block;
      }

      /* When you mouse over the navigation links, change their color */
      .sidenav a:hover {
          color: #ffffff;
          text-shadow: 1px 1px 5px rgba(212, 175, 55, 0.5);
      }

      .mainglobal{
       font-size: min(calc(1vw + 1vh + 1.5vmin), 32px);
       padding: 10px 50px 10px;
       color: var(--text-color);
       grid-column: 2;
     }

      .footer {
       font-size: 18px;
       padding: 5px 2px 5px;
       text-align: left;
       color: var(--text-color);
       grid-area: 3 / 1 / 4 / 3;
       border: 1px solid rgba(212, 175, 55, 0.3);
     }

     
    </style>
    

    <body>
      <div class="wrapper">
        
            <div class="logo">
              
              <div id="neon">MJS.FM</div>
            </div>
            <div class="topnav">
              <a {% if page.title == "Home"%} 
                class="active" 
                {%endif%}
                href="/home/">&lt; Home &gt;</a>
              <a {% if page.title == "About"%} 
              class="active" 
              {%endif%}
              href="/about/">&lt; About &gt;</a>
              <a {% if page.title == "Projects"%} 
              class="active" 
              {%endif%} 
              href="/projects/">&lt; Projects &gt;</a>
              <a {% if page.title == "Blog"%} 
              class="active" 
              {%endif%}
              href="/blog/">&lt; Blog &gt;</a>
              <a {% if page.title == "Art"%} 
              class="active" 
              {%endif%}
              href="/art/">&lt; Art &gt;</a>
              <a 
              {% if page.title == "Tutoring"%} 
                class="active" 
                {%endif%} href="/tutoring/">&lt; Tutoring &gt;</a>
              
             
              
            </div>
        
        
            <div class="sidenav">
                <br>
                <div id="neon">Flash Nav</div>
              <hr color="#d4af37">
              <hr color="#d4af37">
              <a href="/blog/music/weekly/"> "Weekly Bangers"</a>
              {% for post in site.posts %}
                <a href="{{post.permalink}}">{{post.title}}</a>
              {%endfor%}
            </div>
            <div class="mainglobal">
              <hr color="#d4af37">
              <hr color="#d4af37">
              <hr color="#d4af37">
              <hr color="#d4af37">
              {{content}}
              <hr color="#d4af37">
              <hr color="#d4af37">
              <hr color="#d4af37">
              <hr color="#d4af37">
            </div>

            <div class="footer">
              Pink noise through the Void
            </div>
        
      </div>      


    </body>
        
     

     
      
   
    
</html>
